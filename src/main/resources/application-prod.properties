spring.application.name=web-ssh
# Thymeleaf \u6A21\u677F\u7F13\u5B58\u5F00\u5173
spring.thymeleaf.cache=true
# =============================================
# \u670D\u52A1\u7AEF\u53E3
# =============================================
server.port=8066
# \u65F6\u533A\u914D\u7F6E
spring.jackson.time-zone=GMT+8
# =============================================
# \u6587\u4EF6\u4E0A\u4F20\u5927\u5C0F\u9650\u5236
# =============================================
spring.servlet.multipart.max-file-size=500MB
spring.servlet.multipart.max-request-size=500MB



# =============================================
# \u7F51\u9875\u767B\u5F55\u9274\u6743
# enabled=true \u65F6\u5F00\u542F\u767B\u5F55\uFF0C\u9875\u9762\u4E0E WebSocket(/ssh-connect) \u5747\u9700\u5148\u767B\u5F55
# enabled=false \u65F6\u5173\u95ED\u9274\u6743\uFF0C\u65E0\u9700\u767B\u5F55\u76F4\u63A5\u8BBF\u95EE\uFF08\u4FDD\u6301\u65E7\u884C\u4E3A\uFF09
# =============================================
webssh.auth.enabled=true
webssh.auth.username=test
webssh.auth.password=test
# \u767B\u5F55\u5931\u8D25\u6B21\u6570\u4E0A\u9650\uFF0C\u8FBE\u5230\u540E\u9501\u5B9A
webssh.auth.max-fail-count=3
# \u9501\u5B9A\u65F6\u957F\uFF08\u79D2\uFF09\uFF0C\u4E0E\u5931\u8D25\u8BA1\u6570\u7A97\u53E3
webssh.auth.lock-seconds=300
# \u662F\u5426\u4FE1\u4EFB\u4EE3\u7406\u5934(X-Forwarded-For / X-Real-IP)\uFF1A\u524D\u65B9\u6709\u53EF\u4FE1\u53CD\u4EE3\u65F6\u624D\u8BBE true\uFF0C
# \u5426\u5219\u76F4\u63A5\u8FDE\u63A5\u573A\u666F\u53EF\u88AB\u4F2A\u9020\u8BE5\u5934\u7ED5\u8FC7\u5931\u8D25\u9501\u5B9A
webssh.auth.trust-proxy-headers=false
# \u5C01\u7981\u540D\u5355\u6301\u4E45\u5316\u6587\u4EF6\uFF1A\u5931\u8D25\u8FBE\u4E0A\u9650\u540E\u5199\u5165\uFF0C\u91CD\u542F\u4E0D\u6E05\u96F6
# \u89E3\u5C01\u65B9\u5F0F\uFF1A\u7F16\u8F91\u8BE5\u6587\u4EF6\u5220\u9664\u5BF9\u5E94 IP\uFF08\u6216\u5220\u9664\u6574\u4E2A\u6587\u4EF6\uFF09\u540E\u91CD\u542F\u670D\u52A1
webssh.auth.block-file=./data/webssh-blocked-ips.json
